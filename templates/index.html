<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProductManager</title>
</head>
<body>

    <h1>Product Manager</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p>{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter" required>
        <label for="price">Price: </label>
        <input type="number" id="price" name="price" placeholder="Enter" required>
        <label for="category">Category: </label>
        <input type="text" id="category" name="category" placeholder="Enter" required>
        <button type="submit">Add</button>
    </form>

    <form method="GET">
        <select name="category">
            <option value="all" {% if choice_category=='all' %} selected {% endif %}>All</option>

            {% for category in categories %}
                <option value="{{ category }}" {% if choice_category==category %} selected {% endif %}>{{ category.title() }}</option>
            {% endfor %}
        </select>
        <button type="submit">Apply</button>
    </form>

    <h3>Products: </h3>
    <table border="1px" cellpadding="5px">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for item in products %}
                <tr>
                    <td>{{ item["name"] }}</td>
                    <td>{{ item["price"] }}</td>
                    <td>{{ item["category"] }}</td>
                    <td>
                        <a href="{{ url_for('delete', index=loop.index0) }}">
                            <button type="submit">Delete</button>
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
